name: Nova
options:
  bundleIdPrefix: com.nova
  deploymentTarget:
    iOS: "16.0"
targets:
  Nova:
    type: application
    platform: iOS
    sources:
      - Nova
    info:
      path: NovaInfo.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nova.browser
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nova
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Nova usa Face ID para proteger la navegación privada y tus contraseñas guardadas."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Nova se conecta con Nova en tu PC por tu wifi para enviar pestañas y archivos."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Nova añade tus fotos a Archivos de Nova para enviarlas al PC."
        TARGETED_DEVICE_FAMILY: "1,2"
